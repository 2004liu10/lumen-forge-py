[project]
name = "lumen-forge"
version = "0.8.3"
description = "多画布 AI 生成工作台（RunningHub 动作迁移 / 生图 / 视频，多账号并发调度）— Python 版"
requires-python = ">=3.11"
authors = [{ name = "Lumen Forge" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "pillow>=10.4",
    "cryptography>=43.0",
]

[project.optional-dependencies]
# 桌面能力（浏览器自动化 / 密钥托管 / 系统对话框）
desktop = [
    "playwright>=1.48",
    "keyring>=25.0",
]
# 开发与测试
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
lumen-forge = "app.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
